[ai]
enabled = true
rules = ""

[ai.anthropic]

[ai.custom_providers]

[ai.google]

[ai.models]
custom_models = []
displayed_models = []

[ai.open_ai]

[completion]
activate_on_typing = false
auto_close_pairs = true
copilot = "custom"
signature_hint_on_typing = false

[diagnostics]
enabled = false
sql_linter = true

[display]
cell_output = "below"
code_editor_font_size = 12
code_lens = true
dataframes = "rich"
default_table_max_columns = 50
default_table_page_size = 10
default_width = "medium"
reference_highlighting = true
theme = "dark"

[formatting]
line_length = 80

[keymap]
preset = "vim"

[keymap.overrides]

[language_servers.pylsp]
enable_flake8 = false
enable_mypy = false
enable_pydocstyle = false
enable_pyflakes = false
enable_pylint = false
enable_ruff = false
enabled = true

[language_servers.ty]
enabled = false

[mcp]
presets = []

[mcp.mcpServers]

[package_management]
manager = "uv"

[runtime]
auto_instantiate = false
auto_reload = "autorun"
default_csv_encoding = "utf-8"
default_sql_output = "auto"
on_cell_change = "autorun"
output_max_bytes = 8000000
reactive_tests = false
show_tracebacks = false
std_stream_max_bytes = 1000000
watcher_on_save = "autorun"

[save]
autosave = "off"
autosave_delay = 1000
format_on_save = true

[server]
browser = "default"
follow_symlink = false

[snippets]
custom_paths = []
include_default_snippets = true
